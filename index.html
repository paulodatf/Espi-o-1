        :root {
            --bg: #0a0a0c;
            --card: #16161a;
            --accent: #3b82f6;
            --text: #ffffff;
            --text-dim: #94a3b8;
            --border: #2d2d35;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 600px; }

        .search-container {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(12px);
            padding: 20px 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        input {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 2px solid var(--border);
            background: #1c1c21;
            color: white;
            font-size: 1.1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        input:focus {
            border-color: var(--accent);
            background: var(--card);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        #results { margin-top: 25px; }

        .category-box {
            background: var(--card);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            animation: fadeIn 0.4s ease-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .header-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .label {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .relevance-tag {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .word {
            background: #25252e;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .highlight { 
            background: var(--accent) !important; 
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 18px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-msg { text-align: center; color: var(--text-dim); margin-top: 50px; line-height: 1.6; }
    </style>
</head>

function renderResults(results, query) {
    resultsArea.innerHTML = "";
    if (results.length === 0) {
        resultsArea.innerHTML = '<div class="empty-msg">Nenhuma conexão encontrada.</div>';
        return;
    }

        const card = document.createElement('div');
        card.className = 'category-box';
        
        const isHighMatch = group.categoria.toLowerCase().includes(query);

            <div class="header-group">
                <span class="label">Categoria: ${group.categoria}</span>
                ${isHighMatch ? '<span class="relevance-tag">⭐ Melhor Match</span>' : ''}
            </div>
            <div class="word-cloud">
        `;

            const isMatch = item.toLowerCase().includes(query);
            html += `<span class="word ${isMatch ? 'highlight' : ''}">${item}</span>`;
        });

        const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const highlightRegex = new RegExp(`\\b(${escapedQuery})\\b`, "gi");
